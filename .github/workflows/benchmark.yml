name: EEG benchmark checks

on: [push, pull_request]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "2"
      TF_ENABLE_ONEDNN_OPTS: "0"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-benchmark.txt
      - run: python -m pip install -r requirements-benchmark.txt
      - run: python -m unittest discover -s tests
      - name: Run the pipeline on synthetic EEG-shaped rows
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd
          from scripts.benchmark import LABELS

          rng = np.random.default_rng(42)
          data = pd.DataFrame(rng.normal(size=(90, 2548)))
          data["label"] = list(LABELS) * 30
          data.to_csv("synthetic.csv", index=False)
          PY
          python scripts/benchmark.py synthetic.csv --output smoke-results --models dummy random_forest cnn --epochs 1 --shap --save-models
